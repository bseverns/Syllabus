<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">A low-voltage invention: power, path, control, output</title><desc id="desc">A four-step classroom concept map for a low-voltage invention: an approved power source sends energy along a complete path; a switch controls when energy moves; and an LED, buzzer, or motor produces an output. The diagram is not a wiring diagram and adult checks control powered testing.</desc><style>.h{font:700 39px Arial,sans-serif;fill:#14213d}.s{font:400 19px Arial,sans-serif;fill:#40516d}.t{font:700 26px Arial,sans-serif;fill:#14213d}.c{font:400 18px Arial,sans-serif;fill:#263a57}.n{font:700 31px Arial,sans-serif;fill:#fff}.w{font:700 22px Arial,sans-serif;fill:#7f2024}</style><rect width="1200" height="700" fill="#f7f9fc"/><text x="50" y="62" class="h">A low-voltage invention: power → path → control → output</text><text x="50" y="94" class="s">Use the actual approved class materials for connections and polarity. This is a concept map, not a wiring diagram.</text><g stroke-width="3"><rect x="61" y="179" width="241" height="298" rx="21" fill="#fff6dd" stroke="#d89c19"/><rect x="333" y="179" width="241" height="298" rx="21" fill="#eaf3ff" stroke="#4a90d9"/><rect x="605" y="179" width="241" height="298" rx="21" fill="#edf9f2" stroke="#42a26b"/><rect x="877" y="179" width="241" height="298" rx="21" fill="#f1eeff" stroke="#7561c7"/></g><g><circle cx="104" cy="220" r="27" fill="#d89c19"/><text x="95" y="231" class="n">1</text><text x="93" y="278" class="t">Power</text><text x="93" y="323" class="c">An approved battery</text><text x="93" y="349" class="c">starts the energy.</text><circle cx="376" cy="220" r="27" fill="#4a90d9"/><text x="367" y="231" class="n">2</text><text x="365" y="278" class="t">Path</text><text x="365" y="323" class="c">Energy needs a</text><text x="365" y="349" class="c">complete path.</text><circle cx="648" cy="220" r="27" fill="#42a26b"/><text x="639" y="231" class="n">3</text><text x="637" y="278" class="t">Control</text><text x="637" y="323" class="c">A switch chooses</text><text x="637" y="349" class="c">when it turns on.</text><circle cx="920" cy="220" r="27" fill="#7561c7"/><text x="911" y="231" class="n">4</text><text x="909" y="278" class="t">Output</text><text x="909" y="323" class="c">Light, sound, or</text><text x="909" y="349" class="c">motion does one job.</text></g><g fill="none" stroke="#395571" stroke-width="7" stroke-linecap="round"><path d="M303 337h24"/><path d="M575 337h24"/><path d="M847 337h24"/></g><g fill="#395571"><path d="M327 327l15 10-15 10z"/><path d="M599 327l15 10-15 10z"/><path d="M871 327l15 10-15 10z"/></g><rect x="61" y="544" width="1057" height="82" rx="16" fill="#fff0f0" stroke="#cb545c" stroke-width="2"/><text x="88" y="578" class="w">Safety boundary: adults manage batteries, motors, and repairs beyond a simple taped connection.</text><text x="88" y="608" class="c">If a powered output stalls, return to the working paper-switch circuit and keep investigating the control idea.</text></svg>