<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Audience, purpose, mockup, and first test</title>
  <desc id="desc">A sentence frame connects audience, action, and purpose. A rough cardboard mockup narrows a big project idea into one first test.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">Make the idea small enough to test</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">Week 3: audience, purpose, mockup, first proof</text>
  <g transform="translate(55 155)">
    <rect width="520" height="455" rx="20" fill="#f5f3ff"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#5b21b6">PROJECT SENTENCE</text>
    <g font-family="system-ui, sans-serif">
      <rect x="28" y="82" width="464" height="78" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="48" y="113" font-size="17" font-weight="800" fill="#5b21b6">FOR</text><text x="100" y="113" font-size="20" fill="#3b0764">families waiting nearby,</text><text x="48" y="143" font-size="16" fill="#6d28d9">name a real audience</text>
      <rect x="28" y="178" width="464" height="78" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="48" y="209" font-size="17" font-weight="800" fill="#1e3a8a">WE WANT THEM TO</text><text x="225" y="209" font-size="20" fill="#172554">leave a welcome light,</text><text x="48" y="239" font-size="16" fill="#1d4ed8">name one visitor action</text>
      <rect x="28" y="274" width="464" height="78" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="48" y="305" font-size="17" font-weight="800" fill="#166534">SO THAT</text><text x="135" y="305" font-size="20" fill="#14532d">the space feels inviting.</text><text x="48" y="335" font-size="16" fill="#15803d">name the purpose</text>
    </g>
    <text x="28" y="415" font-family="system-ui, sans-serif" font-size="18" fill="#4c1d95">Useful, joyful, memorable, or welcoming all count.</text>
  </g>
  <g transform="translate(625 155)">
    <rect width="520" height="455" rx="20" fill="#fff7ed"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#9a3412">ROUGH MOCKUP → FIRST TEST</text>
    <g transform="translate(35 95)">
      <path d="M15 220 L15 60 L190 20 L190 185Z" fill="#fde68a" stroke="#92400e" stroke-width="5"/>
      <rect x="45" y="83" width="105" height="50" rx="5" fill="white" stroke="#92400e" stroke-width="3"/><text x="98" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#7c2d12">WELCOME</text>
      <circle cx="98" cy="165" r="18" fill="#facc15" stroke="#92400e" stroke-width="3"/>
      <path d="M225 120 H275" stroke="#64748b" stroke-width="8"/><path d="M275 120 l-16 -12 v24z" fill="#64748b"/>
      <rect x="290" y="20" width="180" height="200" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
      <text x="380" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#9a3412">TEST ONE THING</text>
      <text x="380" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#7c2d12">Can a visitor</text><text x="380" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#7c2d12">find the button</text><text x="380" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#7c2d12">without help?</text>
      <text x="380" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Not: “Is it finished?”</text>
    </g>
    <text x="28" y="380" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#7c2d12">Cardboard can test size, layout, and use.</text>
    <text x="28" y="415" font-family="system-ui, sans-serif" font-size="18" fill="#7c2d12">Polish comes after the mockup answers a question.</text>
  </g>
</svg>
