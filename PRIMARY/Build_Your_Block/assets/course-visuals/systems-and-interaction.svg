<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Maker systems and interaction chains</title>
  <desc id="desc">Light, motion, sound, and code are shown as building blocks. A visitor action travels through an input and project system to produce an output.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">A tool becomes useful when it does something for someone</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">Weeks 1–2: building blocks and interaction</text>
  <g transform="translate(55 155)">
    <rect width="500" height="455" rx="20" fill="#fff7ed"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#9a3412">BUILDING BLOCKS</text>
    <g font-family="system-ui, sans-serif" font-size="23" font-weight="800" text-anchor="middle">
      <rect x="35" y="85" width="190" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><circle cx="80" cy="132" r="24" fill="#facc15"/><path d="M80 96 V78 M52 105 L39 92 M108 105 L121 92" stroke="#d97706" stroke-width="5"/><text x="150" y="142" fill="#92400e">LIGHT</text>
      <rect x="275" y="85" width="190" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle cx="325" cy="145" r="26" fill="none" stroke="#2563eb" stroke-width="7"/><path d="M325 108 L340 86 M350 118 L374 110" stroke="#2563eb" stroke-width="6"/><text x="400" y="142" fill="#1e3a8a">MOTION</text>
      <rect x="35" y="245" width="190" height="120" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="4"/><path d="M65 315 Q80 275 95 315 T125 315" fill="none" stroke="#9333ea" stroke-width="7"/><text x="158" y="312" fill="#6b21a8">SOUND</text>
      <rect x="275" y="245" width="190" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="325" y="305" font-family="ui-monospace, monospace" font-size="25" fill="#166534">IF</text><path d="M350 300 H370" stroke="#16a34a" stroke-width="6"/><text x="410" y="312" fill="#166534">CODE</text>
    </g>
    <text x="28" y="420" font-family="system-ui, sans-serif" font-size="18" fill="#7c2d12">Choose one clear block first. Add another only when it helps.</text>
  </g>
  <g transform="translate(605 155)">
    <rect width="540" height="455" rx="20" fill="#eff6ff"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#1e3a8a">INTERACTION CHAIN</text>
    <g transform="translate(25 115)" font-family="system-ui, sans-serif" text-anchor="middle">
      <rect width="140" height="130" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="70" y="48" font-size="20" font-weight="800" fill="#1e3a8a">VISITOR</text><text x="70" y="78" font-size="17" fill="#1e3a8a">presses</text><text x="70" y="102" font-size="17" fill="#1e3a8a">or moves</text>
      <path d="M148 65 H182" stroke="#64748b" stroke-width="7"/><path d="M182 65 l-14 -10 v20z" fill="#64748b"/>
      <rect x="190" width="140" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="260" y="48" font-size="20" font-weight="800" fill="#92400e">INPUT</text><text x="260" y="82" font-size="17" fill="#92400e">button</text><text x="260" y="106" font-size="17" fill="#92400e">or sensor</text>
      <path d="M338 65 H372" stroke="#64748b" stroke-width="7"/><path d="M372 65 l-14 -10 v20z" fill="#64748b"/>
      <rect x="380" width="140" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="450" y="48" font-size="20" font-weight="800" fill="#166534">OUTPUT</text><text x="450" y="82" font-size="17" fill="#166534">light, motion,</text><text x="450" y="106" font-size="17" fill="#166534">or sound</text>
    </g>
    <text x="28" y="310" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#0f172a">WHEN someone does this…</text>
    <text x="28" y="350" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#0f172a">THE PROJECT does that.</text>
    <text x="28" y="415" font-family="system-ui, sans-serif" font-size="18" fill="#334155">Point, label, and draw arrows before adding more effects.</text>
  </g>
</svg>
