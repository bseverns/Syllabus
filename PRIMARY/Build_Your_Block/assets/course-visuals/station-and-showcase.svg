<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Visitor station and showcase readiness</title>
  <desc id="desc">A visitor path moves from waiting to reading to using to exiting while a team observes and resets. A readiness checklist covers station, hosting, backup, and archive.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">The station is part of the project</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">Weeks 6–7: user path, hosting, reset, showcase</text>
  <g transform="translate(55 155)">
    <rect width="650" height="455" rx="20" fill="#eff6ff"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#1e3a8a">VISITOR PATH</text>
    <g transform="translate(28 95)" font-family="system-ui, sans-serif" text-anchor="middle">
      <rect width="120" height="96" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="60" y="42" font-size="18" font-weight="800" fill="#1e3a8a">1 • WAIT</text><text x="60" y="68" font-size="15" fill="#1e3a8a">marked spot</text>
      <path d="M128 48 H158" stroke="#64748b" stroke-width="7"/><path d="M158 48 l-14 -10 v20z" fill="#64748b"/>
      <rect x="166" width="120" height="96" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="226" y="42" font-size="18" font-weight="800" fill="#92400e">2 • READ</text><text x="226" y="68" font-size="15" fill="#92400e">title + cue</text>
      <path d="M294 48 H324" stroke="#64748b" stroke-width="7"/><path d="M324 48 l-14 -10 v20z" fill="#64748b"/>
      <rect x="332" width="120" height="96" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="392" y="42" font-size="18" font-weight="800" fill="#166534">3 • USE</text><text x="392" y="68" font-size="15" fill="#166534">touch + try</text>
      <path d="M460 48 H490" stroke="#64748b" stroke-width="7"/><path d="M490 48 l-14 -10 v20z" fill="#64748b"/>
      <rect x="498" width="120" height="96" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="4"/><text x="558" y="42" font-size="18" font-weight="800" fill="#6b21a8">4 • EXIT</text><text x="558" y="68" font-size="15" fill="#6b21a8">clear path</text>
    </g>
    <g transform="translate(80 245)" font-family="system-ui, sans-serif">
      <rect width="490" height="105" rx="16" fill="white" stroke="#64748b" stroke-width="3"/>
      <text x="25" y="38" font-size="19" font-weight="800" fill="#0f172a">TEAM ROLES</text>
      <text x="25" y="72" font-size="18" fill="#334155">WELCOME • OBSERVE • EXPLAIN • RESET</text>
    </g>
    <text x="28" y="420" font-family="system-ui, sans-serif" font-size="18" fill="#334155">If visitors get stuck in the same place, fix the station—not only the speech.</text>
  </g>
  <g transform="translate(755 155)">
    <rect width="390" height="455" rx="20" fill="#fff7ed"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#9a3412">SHOWCASE READY?</text>
    <g transform="translate(28 90)" font-family="system-ui, sans-serif" fill="#7c2d12">
      <text y="0" font-size="20" font-weight="800">✓ STATION</text><text y="28" font-size="16">title, touch cue, waiting spot</text>
      <text y="82" font-size="20" font-weight="800">✓ HOSTING</text><text y="110" font-size="16">welcome, purpose, handoff</text>
      <text y="164" font-size="20" font-weight="800">✓ BACKUP</text><text y="192" font-size="16">calm fix and reset plan</text>
      <text y="246" font-size="20" font-weight="800">✓ ARCHIVE</text><text y="274" font-size="16">full photo, detail, quote, artifact</text>
    </g>
    <text x="28" y="415" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#7c2d12">Install first. Decorate second.</text>
  </g>
</svg>
