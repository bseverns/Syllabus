<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Prototype and revision cycle</title>
  <desc id="desc">A four-step loop moves from build to test to observe to fix. A checklist prioritizes core function, durability, clarity, and reset before extra features.</desc>
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white">A rough version teaches faster than a perfect plan</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#cbd5e1">Weeks 4–5: build, test, repair, clarify</text>
  <g transform="translate(55 155)">
    <rect width="610" height="455" rx="20" fill="#172554" stroke="#334155" stroke-width="2"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#67e8f9">PROTOTYPE LOOP</text>
    <g font-family="system-ui, sans-serif" font-size="21" font-weight="800" text-anchor="middle">
      <rect x="55" y="90" width="160" height="82" rx="16" fill="#164e63" stroke="#22d3ee" stroke-width="4"/><text x="135" y="140" fill="white">1 • BUILD</text>
      <rect x="395" y="90" width="160" height="82" rx="16" fill="#3b0764" stroke="#c084fc" stroke-width="4"/><text x="475" y="140" fill="white">2 • TEST</text>
      <rect x="395" y="280" width="160" height="82" rx="16" fill="#7c2d12" stroke="#fb923c" stroke-width="4"/><text x="475" y="330" fill="white">3 • OBSERVE</text>
      <rect x="55" y="280" width="160" height="82" rx="16" fill="#14532d" stroke="#4ade80" stroke-width="4"/><text x="135" y="330" fill="white">4 • FIX</text>
    </g>
    <g fill="none" stroke="#cbd5e1" stroke-width="7"><path d="M225 131 H377"/><path d="M475 182 V262"/><path d="M385 321 H233"/><path d="M135 270 V190"/></g>
    <g fill="#cbd5e1"><path d="M377 131 l-16 -12 v24z"/><path d="M475 262 l-12 -16 h24z"/><path d="M233 321 l16 -12 v24z"/><path d="M135 190 l-12 16 h24z"/></g>
    <text x="305" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#dbeafe">Change one thing.</text><text x="305" y="247" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#dbeafe">Test again.</text>
    <text x="28" y="420" font-family="system-ui, sans-serif" font-size="18" fill="#cbd5e1">Save a photo and one sentence before parking the build.</text>
  </g>
  <g transform="translate(715 155)">
    <rect width="430" height="455" rx="20" fill="#ecfdf5"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#065f46">FIX BEFORE FEATURES</text>
    <g transform="translate(28 88)" font-family="system-ui, sans-serif">
      <circle cx="18" cy="18" r="18" fill="#059669"/><text x="18" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="white">1</text><text x="55" y="14" font-size="19" font-weight="750" fill="#064e3b">CORE FUNCTION</text><text x="55" y="40" font-size="16" fill="#065f46">Does the main action work?</text>
      <g transform="translate(0 78)"><circle cx="18" cy="18" r="18" fill="#059669"/><text x="18" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="white">2</text><text x="55" y="14" font-size="19" font-weight="750" fill="#064e3b">DURABILITY</text><text x="55" y="40" font-size="16" fill="#065f46">Will it survive five visitors?</text></g>
      <g transform="translate(0 156)"><circle cx="18" cy="18" r="18" fill="#059669"/><text x="18" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="white">3</text><text x="55" y="14" font-size="19" font-weight="750" fill="#064e3b">CLARITY</text><text x="55" y="40" font-size="16" fill="#065f46">Can someone use it without a speech?</text></g>
      <g transform="translate(0 234)"><circle cx="18" cy="18" r="18" fill="#059669"/><text x="18" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="white">4</text><text x="55" y="14" font-size="19" font-weight="750" fill="#064e3b">RESET</text><text x="55" y="40" font-size="16" fill="#065f46">Can the next visitor start?</text></g>
    </g>
    <text x="28" y="415" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#064e3b">Extra features wait until all four hold.</text>
  </g>
</svg>
