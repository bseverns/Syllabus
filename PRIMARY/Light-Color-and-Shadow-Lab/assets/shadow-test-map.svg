<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Shadow test: light, object, screen</title><desc id="desc">A young-learner visual that shows a low-heat light aimed at an object and a screen. It asks learners to test moving the object nearer the light and then nearer the screen, and to notice changes in the shadow. It includes the safety rule to point lights at a wall or table, not eyes.</desc><style>.h{font:700 39px Arial,sans-serif;fill:#14213d}.s{font:400 19px Arial,sans-serif;fill:#40516d}.t{font:700 27px Arial,sans-serif;fill:#14213d}.c{font:400 20px Arial,sans-serif;fill:#263a57}.b{font:700 24px Arial,sans-serif;fill:#7f2024}</style><rect width="1200" height="700" fill="#f7f9fc"/><text x="50" y="62" class="h">Shadow test: light → object → screen</text><text x="50" y="94" class="s">Move one thing, then look closely at what changes.</text><rect x="58" y="153" width="1084" height="385" rx="22" fill="#f0f6ff" stroke="#4a90d9" stroke-width="3"/><circle cx="180" cy="325" r="51" fill="#ffd45e" stroke="#d89c19" stroke-width="6"/><path d="M236 304l250-105v253z" fill="#fff2a8" opacity=".75"/><text x="121" y="410" class="t">low-heat light</text><path d="M494 272l45 47-45 48-45-48z" fill="#394a62"/><text x="443" y="410" class="t">object</text><rect x="845" y="204" width="39" height="229" rx="6" fill="#fff" stroke="#526a86" stroke-width="6"/><ellipse cx="819" cy="319" rx="29" ry="69" fill="#526a86" opacity=".65"/><text x="811" y="472" class="t">screen</text><path d="M270 540h-84" fill="none" stroke="#cf5a65" stroke-width="7" stroke-linecap="round"/><path d="M186 530l-16 10 16 10z" fill="#cf5a65"/><path d="M470 540h84" fill="none" stroke="#42a26b" stroke-width="7" stroke-linecap="round"/><path d="M554 530l16 10-16 10z" fill="#42a26b"/><text x="90" y="586" class="c">Try: move object nearer the light.</text><text x="642" y="586" class="c">Then: move it nearer the screen.</text><rect x="58" y="607" width="1084" height="54" rx="15" fill="#fff0f0" stroke="#cb545c" stroke-width="2"/><text x="84" y="642" class="b">Safety: point lights at the wall or table—never at eyes. Adults manage batteries and clips.</text></svg>