<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Chain reaction playground: start, watch, reset, change</title><desc id="desc">A four-step visual for young learners building a chain reaction: start one safe action, watch what happens next, reset the same way, and change one thing before trying again. The visual emphasizes a reliable two-action chain as success.</desc><style>.h{font:700 39px Arial,sans-serif;fill:#14213d}.s{font:400 20px Arial,sans-serif;fill:#40516d}.t{font:700 27px Arial,sans-serif;fill:#14213d}.c{font:400 20px Arial,sans-serif;fill:#263a57}.n{font:700 32px Arial,sans-serif;fill:#fff}.b{font:700 25px Arial,sans-serif;fill:#6d4a06}</style><rect width="1200" height="700" fill="#f7f9fc"/><text x="50" y="62" class="h">Build a chain: start → watch → reset → change one thing</text><text x="50" y="94" class="s">A reliable two-action chain is a complete success.</text><g stroke-width="3"><rect x="65" y="166" width="245" height="326" rx="23" fill="#fff6dd" stroke="#d89c19"/><rect x="343" y="166" width="245" height="326" rx="23" fill="#eaf3ff" stroke="#4a90d9"/><rect x="621" y="166" width="245" height="326" rx="23" fill="#edf9f2" stroke="#42a26b"/><rect x="899" y="166" width="245" height="326" rx="23" fill="#fff0f1" stroke="#cf5a65"/></g><g><circle cx="108" cy="210" r="28" fill="#d89c19"/><text x="99" y="221" class="n">1</text><text x="146" y="219" class="t">Start</text><text x="90" y="292" class="c">Roll, tip, slide,</text><text x="90" y="320" class="c">drop, or knock.</text><circle cx="386" cy="210" r="28" fill="#4a90d9"/><text x="377" y="221" class="n">2</text><text x="424" y="219" class="t">Watch</text><text x="368" y="292" class="c">What happens</text><text x="368" y="320" class="c">next?</text><circle cx="664" cy="210" r="28" fill="#42a26b"/><text x="655" y="221" class="n">3</text><text x="702" y="219" class="t">Reset</text><text x="646" y="292" class="c">Put the parts</text><text x="646" y="320" class="c">back the same way.</text><circle cx="942" cy="210" r="28" fill="#cf5a65"/><text x="933" y="221" class="n">4</text><text x="980" y="219" class="t">Change</text><text x="924" y="292" class="c">Try one new</text><text x="924" y="320" class="c">thing, then test.</text></g><g fill="none" stroke="#395571" stroke-width="7" stroke-linecap="round"><path d="M311 328h25"/><path d="M589 328h25"/><path d="M867 328h25"/></g><g fill="#395571"><path d="M336 318l15 10-15 10z"/><path d="M614 318l15 10-15 10z"/><path d="M892 318l15 10-15 10z"/></g><path d="M1022 505c0 91-672 91-672 0" fill="none" stroke="#395571" stroke-width="7" stroke-linecap="round"/><path d="M350 495l-15 10 15 10z" fill="#395571"/><rect x="65" y="574" width="1079" height="62" rx="17" fill="#fff6dd" stroke="#d89c19" stroke-width="2"/><text x="91" y="613" class="b">Keep the chain low and inside its tray or marked area. When it stops, find the next thing to test.</text></svg>