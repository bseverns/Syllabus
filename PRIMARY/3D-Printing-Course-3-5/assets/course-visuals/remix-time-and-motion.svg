<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Responsible remixing, print-time choices, and articulated clearance</title>
  <desc id="desc">A remix combines a credited source with a clear change. Print-time controls reduce scale, walls, detail, or solid material. Linked parts have a visible gap.</desc>
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white">Borrow responsibly. Change intentionally. Print realistically.</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#cbd5e1">Weeks 5–7: remix, time budget, moving parts</text>
  <g transform="translate(55 155)">
    <rect width="520" height="455" rx="20" fill="#172554" stroke="#334155" stroke-width="2"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#fde047">REMIX = SOURCE + CHANGE + CREDIT</text>
    <g transform="translate(28 86)" font-family="system-ui, sans-serif">
      <rect width="205" height="145" rx="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/><text x="18" y="34" font-size="19" font-weight="800" fill="white">SOURCE MODEL</text><circle cx="75" cy="88" r="30" fill="#93c5fd"/><rect x="110" y="58" width="60" height="60" rx="8" fill="#bfdbfe"/>
      <text x="250" y="82" font-size="38" font-weight="800" fill="#cbd5e1">+</text>
      <rect x="305" width="160" height="145" rx="14" fill="#3b0764" stroke="#c084fc" stroke-width="3"/><text x="323" y="34" font-size="19" font-weight="800" fill="white">YOUR CHANGE</text><path d="M340 115 L385 55 L430 115Z" fill="#f0abfc"/>
      <text x="0" y="195" font-size="19" font-weight="800" fill="#fde047">CREDIT NOTE</text>
      <text x="0" y="228" font-size="17" fill="#dbeafe">TITLE • CREATOR • SOURCE • LICENSE</text>
      <text x="0" y="268" font-size="16" fill="#cbd5e1">Credit does not replace making a real change.</text>
    </g>
    <text x="28" y="420" font-family="system-ui, sans-serif" font-size="17" fill="#cbd5e1">Keep the source link in the print request.</text>
  </g>
  <g transform="translate(625 155)">
    <rect width="520" height="455" rx="20" fill="#052e2b" stroke="#334155" stroke-width="2"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#6ee7b7">FIT THE PRINT BUDGET</text>
    <g transform="translate(28 82)" font-family="system-ui, sans-serif">
      <text font-size="19" font-weight="800" fill="white">TOO SLOW?</text>
      <text y="38" font-size="17" fill="#a7f3d0">smaller scale • fewer walls • bigger layers • less solid mass</text>
      <rect y="70" width="464" height="108" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
      <text x="18" y="105" font-size="19" font-weight="800" fill="white">MOVING PARTS NEED AIR</text>
      <circle cx="155" cy="143" r="24" fill="none" stroke="#6ee7b7" stroke-width="12"/><circle cx="215" cy="143" r="24" fill="none" stroke="#6ee7b7" stroke-width="12"/>
      <path d="M185 118 V168" stroke="#fde047" stroke-width="4"/><text x="252" y="149" font-size="17" fill="#d1fae5">gap ≥ class rule</text>
      <text y="225" font-size="19" font-weight="800" fill="white">ORIENTATION CHANGES RESULTS</text>
      <path d="M20 310 V252 H120 V310" fill="none" stroke="#60a5fa" stroke-width="10"/><path d="M185 310 H285 V252" fill="none" stroke="#fb923c" stroke-width="10"/>
      <text x="320" y="268" font-size="16" fill="#d1fae5">layers can bend</text><text x="320" y="294" font-size="16" fill="#d1fae5">or split differently</text>
    </g>
    <text x="28" y="420" font-family="system-ui, sans-serif" font-size="17" fill="#a7f3d0">Function first. Character details second.</text>
  </g>
</svg>
