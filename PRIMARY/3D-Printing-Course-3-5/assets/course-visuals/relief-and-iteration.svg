<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Turning 2D graphics into relief and improving a print</title>
  <desc id="desc">A flat icon gains a base and raised foreground to become a relief badge. A first print is observed, changed, and printed as version two.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">Depth and revision turn an idea into a better object</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">Weeks 8–9: 2D to 3D relief, then version 1 to version 2</text>
  <g transform="translate(55 155)">
    <rect width="520" height="455" rx="20" fill="#f5f3ff"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#5b21b6">FLAT ART → PRINTABLE RELIEF</text>
    <g transform="translate(32 90)">
      <rect width="160" height="210" rx="14" fill="white" stroke="#7c3aed" stroke-width="4"/><path d="M35 150 L80 55 L125 150Z" fill="#a78bfa"/><text x="80" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#5b21b6">one flat shape</text>
      <path d="M180 105 H235" stroke="#64748b" stroke-width="8"/><path d="M235 105 l-16 -12 v24z" fill="#64748b"/>
      <g transform="translate(255)"><path d="M5 180 L20 50 L165 50 L150 180Z" fill="#c4b5fd" stroke="#7c3aed" stroke-width="4"/><path d="M50 145 L92 72 L134 145Z" fill="#6d28d9"/><path d="M5 180 L20 195 L150 195 L165 180" fill="#8b5cf6"/><text x="85" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#5b21b6">base + raised detail</text></g>
    </g>
    <text x="28" y="360" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#4c1d95">SIMPLIFY PATHS • ADD THICKNESS • KEEP A FLAT BASE</text>
    <text x="28" y="415" font-family="system-ui, sans-serif" font-size="18" fill="#4c1d95">Screen detail disappears when it is too thin to print.</text>
  </g>
  <g transform="translate(625 155)">
    <rect width="520" height="455" rx="20" fill="#eff6ff"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#1e3a8a">ITERATION IS NORMAL</text>
    <g transform="translate(28 90)" font-family="system-ui, sans-serif" text-anchor="middle">
      <rect width="130" height="150" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="65" y="40" font-size="20" font-weight="800" fill="#991b1b">V1</text><path d="M25 125 L65 55 L105 125Z" fill="#fca5a5"/><path d="M65 55 V125" stroke="#991b1b" stroke-width="5"/><text x="65" y="178" font-size="15" fill="#7f1d1d">split here</text>
      <path d="M142 75 H185" stroke="#64748b" stroke-width="7"/><path d="M185 75 l-14 -10 v20z" fill="#64748b"/>
      <rect x="195" width="130" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="260" y="40" font-size="18" font-weight="800" fill="#92400e">CHANGE</text><text x="260" y="78" font-size="16" fill="#92400e">rotate</text><text x="260" y="104" font-size="16" fill="#92400e">thicken</text><text x="260" y="130" font-size="16" fill="#92400e">support</text>
      <path d="M337 75 H380" stroke="#64748b" stroke-width="7"/><path d="M380 75 l-14 -10 v20z" fill="#64748b"/>
      <rect x="390" width="100" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="440" y="40" font-size="20" font-weight="800" fill="#166534">V2</text><path d="M405 125 L440 65 L475 125Z" fill="#86efac"/>
    </g>
    <text x="28" y="325" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#172554">OBSERVE → CHANGE ONE THING → PREDICT</text>
    <text x="28" y="370" font-family="system-ui, sans-serif" font-size="18" fill="#334155">“It failed” is evidence, not the end.</text>
    <text x="28" y="415" font-family="system-ui, sans-serif" font-size="18" fill="#334155">Name what changed and what you expect next.</text>
  </g>
</svg>
