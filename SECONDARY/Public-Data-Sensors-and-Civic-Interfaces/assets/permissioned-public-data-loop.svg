<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">From a permissioned observation to a public interface</title><desc id="desc">A five-step civic-data workflow: ask a bounded question and set a privacy boundary; get permission and collect a small non-sensitive observation; keep context with the record; make a legible public prototype; and user-test, revise, and name the limit.</desc><style>.h{font:700 37px Arial,sans-serif;fill:#14213d}.s{font:400 18px Arial,sans-serif;fill:#40516d}.t{font:700 20px Arial,sans-serif;fill:#14213d}.c{font:400 16px Arial,sans-serif;fill:#263a57}.n{font:700 25px Arial,sans-serif;fill:#fff}.w{font:700 21px Arial,sans-serif;fill:#702028}</style><rect width="1200" height="700" fill="#f7f9fc"/><text x="48" y="58" class="h">A public interface begins with a permissioned, bounded observation</text><text x="48" y="89" class="s">A number is not permission, and it is not meaning yet.</text><g stroke-width="3"><rect x="42" y="159" width="202" height="325" rx="19" fill="#fff6e3" stroke="#db9b19"/><rect x="270" y="159" width="202" height="325" rx="19" fill="#eaf3ff" stroke="#4a90d9"/><rect x="498" y="159" width="202" height="325" rx="19" fill="#edf9f2" stroke="#42a26b"/><rect x="726" y="159" width="202" height="325" rx="19" fill="#f1eeff" stroke="#7561c7"/><rect x="954" y="159" width="202" height="325" rx="19" fill="#fff0f0" stroke="#cb545c"/></g><g><circle cx="80" cy="200" r="24" fill="#db9b19"/><text x="72" y="210" class="n">1</text><text x="66" y="251" class="t">Question +</text><text x="66" y="277" class="t">boundary</text><text x="66" y="321" class="c">What helps? What</text><text x="66" y="345" class="c">will not be collected?</text><circle cx="308" cy="200" r="24" fill="#4a90d9"/><text x="300" y="210" class="n">2</text><text x="294" y="251" class="t">Permissioned</text><text x="294" y="277" class="t">observation</text><text x="294" y="321" class="c">Use a small,</text><text x="294" y="345" class="c">non-sensitive sample.</text><circle cx="536" cy="200" r="24" fill="#42a26b"/><text x="528" y="210" class="n">3</text><text x="522" y="251" class="t">Keep context</text><text x="522" y="277" class="t">with data</text><text x="522" y="321" class="c">Record when, where,</text><text x="522" y="345" class="c">how, and uncertainty.</text><circle cx="764" cy="200" r="24" fill="#7561c7"/><text x="756" y="210" class="n">4</text><text x="750" y="251" class="t">Public</text><text x="750" y="277" class="t">prototype</text><text x="750" y="321" class="c">Make a sign, map,</text><text x="750" y="345" class="c">dashboard, or guide.</text><circle cx="992" cy="200" r="24" fill="#cb545c"/><text x="984" y="210" class="n">5</text><text x="978" y="251" class="t">Test +</text><text x="978" y="277" class="t">name limits</text><text x="978" y="321" class="c">Revise from a user</text><text x="978" y="345" class="c">encounter; state limits.</text></g><g fill="none" stroke="#395571" stroke-width="6" stroke-linecap="round"><path d="M245 321h19"/><path d="M473 321h19"/><path d="M701 321h19"/><path d="M929 321h19"/></g><g fill="#395571"><path d="M264 313l12 8-12 8z"/><path d="M492 313l12 8-12 8z"/><path d="M720 313l12 8-12 8z"/><path d="M948 313l12 8-12 8z"/></g><rect x="42" y="548" width="1114" height="84" rx="16" fill="#fff0f0" stroke="#cb545c" stroke-width="2"/><text x="68" y="582" class="w">Privacy boundary: never collect identifying, biometric, precise-location, voice, or other sensitive data for this studio.</text><text x="68" y="612" class="c">Keep raw local observations private; do not upload them to a public service without host approval.</text></svg>