<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">FPV crash recovery: stop, secure, inspect, decide, log</title><desc id="desc">A five-step student visual for an FPV crash: disarm, wait for the flight area to be safe and remove the battery, inspect the craft, get instructor clearance before bench testing or returning to flight, then log the repair.</desc><style>.h{font:700 39px Arial,sans-serif;fill:#14213d}.s{font:400 19px Arial,sans-serif;fill:#40516d}.t{font:700 23px Arial,sans-serif;fill:#14213d}.c{font:400 17px Arial,sans-serif;fill:#263a57}.n{font:700 28px Arial,sans-serif;fill:#fff}.warn{font:700 22px Arial,sans-serif;fill:#7f2024}</style><rect width="1200" height="700" fill="#f7f9fc"/><text x="50" y="60" class="h">After a crash: stop → secure → inspect → decide → log</text><text x="50" y="93" class="s">This recovery map does not authorize re-power or flight. The instructor controls the next clearance.</text><g stroke-width="3"><rect x="50" y="176" width="194" height="286" rx="20" fill="#fff0f0" stroke="#cb545c"/><rect x="276" y="176" width="194" height="286" rx="20" fill="#fff6e3" stroke="#db9b19"/><rect x="502" y="176" width="194" height="286" rx="20" fill="#eaf3ff" stroke="#4a90d9"/><rect x="728" y="176" width="194" height="286" rx="20" fill="#edf9f2" stroke="#42a26b"/><rect x="954" y="176" width="194" height="286" rx="20" fill="#f1eeff" stroke="#7561c7"/></g><g><circle cx="89" cy="217" r="25" fill="#cb545c"/><text x="81" y="227" class="n">1</text><text x="79" y="275" class="t">Disarm</text><text x="79" y="310" class="c">Say “crash.” Do not</text><text x="79" y="336" class="c">re-arm or re-power.</text><circle cx="315" cy="217" r="25" fill="#db9b19"/><text x="307" y="227" class="n">2</text><text x="305" y="275" class="t">Secure</text><text x="305" y="310" class="c">Wait for the area,</text><text x="305" y="336" class="c">then remove battery.</text><circle cx="541" cy="217" r="25" fill="#4a90d9"/><text x="533" y="227" class="n">3</text><text x="531" y="275" class="t">Inspect</text><text x="531" y="310" class="c">Props, motors, frame,</text><text x="531" y="336" class="c">camera, antenna.</text><circle cx="767" cy="217" r="25" fill="#42a26b"/><text x="759" y="227" class="n">4</text><text x="757" y="275" class="t">Decide</text><text x="757" y="310" class="c">Instructor directs</text><text x="757" y="336" class="c">bench check or repair.</text><circle cx="993" cy="217" r="25" fill="#7561c7"/><text x="985" y="227" class="n">5</text><text x="983" y="275" class="t">Log</text><text x="983" y="310" class="c">Record damage, repair,</text><text x="983" y="336" class="c">and next test.</text></g><g fill="none" stroke="#395571" stroke-width="6" stroke-linecap="round"><path d="M245 319h23"/><path d="M471 319h23"/><path d="M697 319h23"/><path d="M923 319h23"/></g><g fill="#395571"><path d="M268 311l12 8-12 8z"/><path d="M494 311l12 8-12 8z"/><path d="M720 311l12 8-12 8z"/><path d="M946 311l12 8-12 8z"/></g><rect x="50" y="530" width="1098" height="95" rx="16" fill="#fff0f0" stroke="#cb545c" stroke-width="2"/><text x="76" y="567" class="warn">If impact was severe, use the instructor-approved continuity/bench check before anything returns to powered testing.</text><text x="76" y="601" class="c">Never handle a spinning craft. Stop, wait, and make the flight area safe first.</text></svg>