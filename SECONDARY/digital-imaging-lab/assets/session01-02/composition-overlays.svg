<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Three composition tools</title>
  <desc id="desc">Diagrams demonstrate rule of thirds, leading lines, and foreground, middle ground, and background.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="60" y="72" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#0f172a">Three ways to organize a frame</text>
  <text x="60" y="112" font-family="system-ui, sans-serif" font-size="22" fill="#475569">The overlay is a prompt, not a rule.</text>

  <g transform="translate(60 160)">
    <rect width="330" height="390" rx="18" fill="#dbeafe"/>
    <circle cx="230" cy="125" r="42" fill="#f59e0b"/>
    <path d="M0 260 L110 170 L205 260 L270 205 L330 265 V330 H0Z" fill="#64748b"/>
    <g stroke="#ef4444" stroke-width="3" opacity=".9">
      <path d="M110 0 V330 M220 0 V330 M0 110 H330 M0 220 H330"/>
    </g>
    <circle cx="220" cy="110" r="8" fill="#ef4444"/>
    <text x="18" y="365" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">RULE OF THIRDS</text>
  </g>

  <g transform="translate(435 160)">
    <rect width="330" height="390" rx="18" fill="#e2e8f0"/>
    <rect y="0" width="330" height="190" rx="18" fill="#bae6fd"/>
    <path d="M0 330 L150 135 L180 135 L330 330Z" fill="#94a3b8"/>
    <path d="M20 330 L158 145 M310 330 L172 145" stroke="#f8fafc" stroke-width="8"/>
    <circle cx="165" cy="140" r="15" fill="#ef4444"/>
    <path d="M45 310 Q110 225 155 155" fill="none" stroke="#ef4444" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="18" y="365" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">LEADING LINES</text>
  </g>

  <g transform="translate(810 160)">
    <rect width="330" height="390" rx="18" fill="#bfdbfe"/>
    <rect y="190" width="330" height="140" fill="#86efac"/>
    <circle cx="255" cy="85" r="36" fill="#fde047"/>
    <path d="M58 210 L95 120 L132 210Z" fill="#475569"/>
    <path d="M120 220 L175 95 L230 220Z" fill="#64748b"/>
    <path d="M0 330 Q105 230 330 250 V330Z" fill="#166534"/>
    <g font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      <text x="16" y="44" fill="#1e3a8a">BACKGROUND</text>
      <text x="16" y="215" fill="#14532d">MIDDLE</text>
      <text x="16" y="305" fill="white">FOREGROUND</text>
    </g>
    <text x="18" y="365" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">DEPTH</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
