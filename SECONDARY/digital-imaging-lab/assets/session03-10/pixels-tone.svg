<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Pixels, resolution, tone, and color</title>
  <desc id="desc">The left compares smooth and visibly pixelated circles. The right compares neutral, warm, and cool versions of one scene.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">Same information, different decisions</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">Session 3: resolution • Session 4: tone and color</text>
  <g transform="translate(55 155)">
    <rect width="520" height="455" rx="20" fill="#e0f2fe"/><text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#0c4a6e">RESOLUTION</text>
    <circle cx="140" cy="200" r="88" fill="#0284c7"/><text x="78" y="325" font-family="system-ui, sans-serif" font-size="20" fill="#0c4a6e">smooth edge</text>
    <g shape-rendering="crispEdges" fill="#0284c7"><rect x="320" y="112" width="48" height="48"/><rect x="368" y="88" width="96" height="48"/><rect x="464" y="112" width="24" height="48"/><rect x="296" y="160" width="192" height="96"/><rect x="320" y="256" width="144" height="48"/><rect x="344" y="304" width="96" height="24"/></g>
    <text x="326" y="355" font-family="system-ui, sans-serif" font-size="20" fill="#0c4a6e">visible grid</text><text x="28" y="410" font-family="system-ui, sans-serif" font-size="18" fill="#334155">Zoom changes what you see—not what the file contains.</text>
  </g>
  <g transform="translate(625 155)">
    <rect width="520" height="455" rx="20" fill="#fff7ed"/><text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#7c2d12">TONE + COLOR</text>
    <g transform="translate(28 85)">
      <g><rect width="140" height="210" rx="12" fill="#d1d5db"/><circle cx="100" cy="58" r="28" fill="#f8fafc"/><path d="M0 210 L55 115 L95 175 L140 130 V210Z" fill="#64748b"/><text x="35" y="245" font-family="system-ui, sans-serif" font-size="18" fill="#334155">neutral</text></g>
      <g transform="translate(162)"><rect width="140" height="210" rx="12" fill="#fed7aa"/><circle cx="100" cy="58" r="28" fill="#f59e0b"/><path d="M0 210 L55 115 L95 175 L140 130 V210Z" fill="#9a3412"/><text x="46" y="245" font-family="system-ui, sans-serif" font-size="18" fill="#7c2d12">warm</text></g>
      <g transform="translate(324)"><rect width="140" height="210" rx="12" fill="#bfdbfe"/><circle cx="100" cy="58" r="28" fill="#e0f2fe"/><path d="M0 210 L55 115 L95 175 L140 130 V210Z" fill="#1e3a8a"/><text x="52" y="245" font-family="system-ui, sans-serif" font-size="18" fill="#1e3a8a">cool</text></g>
    </g>
    <text x="28" y="410" font-family="system-ui, sans-serif" font-size="18" fill="#7c2d12">Ask: what changed technically, and what changed emotionally?</text>
  </g>
</svg>
