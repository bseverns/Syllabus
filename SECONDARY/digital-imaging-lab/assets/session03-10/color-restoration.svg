<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Color mood and ethical restoration</title>
  <desc id="desc">The left shows three color palettes with different moods. The right separates restorative edits from misleading edits.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">Every edit makes a claim</text><text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">Session 7: color mood • Session 8: restoration and ethics</text>
  <g transform="translate(55 155)">
    <rect width="520" height="455" rx="20" fill="#f5f3ff"/><text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#5b21b6">COLOR MOOD</text>
    <g transform="translate(35 95)"><g><rect width="130" height="90" rx="12" fill="#0f172a"/><rect y="90" width="130" height="70" fill="#2563eb"/><rect y="160" width="130" height="55" rx="0 0 12 12" fill="#a5f3fc"/><text x="37" y="250" font-family="system-ui, sans-serif" font-size="18" fill="#334155">calm?</text></g><g transform="translate(155)"><rect width="130" height="90" rx="12" fill="#7c2d12"/><rect y="90" width="130" height="70" fill="#f97316"/><rect y="160" width="130" height="55" rx="0 0 12 12" fill="#fde68a"/><text x="34" y="250" font-family="system-ui, sans-serif" font-size="18" fill="#334155">urgent?</text></g><g transform="translate(310)"><rect width="130" height="90" rx="12" fill="#581c87"/><rect y="90" width="130" height="70" fill="#db2777"/><rect y="160" width="130" height="55" rx="0 0 12 12" fill="#a3e635"/><text x="25" y="250" font-family="system-ui, sans-serif" font-size="18" fill="#334155">electric?</text></g></g>
    <text x="28" y="410" font-family="system-ui, sans-serif" font-size="18" fill="#334155">Mood is a proposal. Context and culture change the answer.</text>
  </g>
  <g transform="translate(625 155)">
    <rect width="520" height="455" rx="20" fill="#f0fdf4"/><text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#166534">RESTORE OR MISLEAD?</text>
    <g transform="translate(35 92)" font-family="system-ui, sans-serif"><rect width="210" height="235" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="22" y="42" font-size="23" font-weight="800" fill="#166534">RESTORE</text><text x="22" y="82" font-size="17" fill="#14532d">✓ remove dust</text><text x="22" y="116" font-size="17" fill="#14532d">✓ repair a tear</text><text x="22" y="150" font-size="17" fill="#14532d">✓ recover faded tone</text><text x="22" y="194" font-size="15" fill="#166534">Keep the event intact.</text></g>
    <g transform="translate(275 92)" font-family="system-ui, sans-serif"><rect width="210" height="235" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="22" y="42" font-size="23" font-weight="800" fill="#991b1b">MISLEAD</text><text x="22" y="82" font-size="17" fill="#7f1d1d">× remove a person</text><text x="22" y="116" font-size="17" fill="#7f1d1d">× invent evidence</text><text x="22" y="150" font-size="17" fill="#7f1d1d">× hide the edit</text><text x="22" y="194" font-size="15" fill="#991b1b">Changes what happened.</text></g>
    <text x="28" y="410" font-family="system-ui, sans-serif" font-size="18" fill="#14532d">Ask: purpose, consent, context—and who could be harmed?</text>
  </g>
</svg>
