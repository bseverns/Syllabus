<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Layers, masks, and poster hierarchy</title>
  <desc id="desc">The left shows stacked image layers and a mask. The right compares a crowded poster with a poster that has clear hierarchy.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">Structure before polish</text><text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">Session 5: layers and masks • Session 6: poster hierarchy</text>
  <g transform="translate(55 155)">
    <rect width="520" height="455" rx="20" fill="#ecfeff"/><text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#155e75">LAYER STACK</text>
    <g transform="translate(60 90) skewX(-12)"><rect x="75" y="170" width="300" height="130" rx="10" fill="#0e7490"/><text x="95" y="245" font-family="system-ui, sans-serif" font-size="23" fill="white">BACKGROUND</text><rect x="45" y="105" width="300" height="130" rx="10" fill="#67e8f9" opacity=".9"/><circle cx="260" cy="165" r="42" fill="#facc15"/><text x="65" y="180" font-family="system-ui, sans-serif" font-size="23" fill="#164e63">PHOTO</text><rect x="15" y="40" width="300" height="130" rx="10" fill="white" opacity=".88"/><text x="45" y="118" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#0f172a">TEXT</text></g>
    <circle cx="430" cy="132" r="44" fill="white" stroke="#0f172a" stroke-width="5"/><path d="M430 88 A44 44 0 0 1 430 176Z" fill="#0f172a"/><text x="390" y="205" font-family="system-ui, sans-serif" font-size="16" fill="#334155">mask</text><text x="28" y="410" font-family="system-ui, sans-serif" font-size="18" fill="#334155">A mask hides pixels without deleting the layer.</text>
  </g>
  <g transform="translate(625 155)">
    <rect width="520" height="455" rx="20" fill="#fff7ed"/><text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#9a3412">POSTER HIERARCHY</text>
    <g transform="translate(35 85)"><rect width="190" height="270" rx="10" fill="#fde68a"/><text x="12" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">EVERYTHING!</text><text x="12" y="82" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">IS! EQUALLY!</text><text x="12" y="122" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#15803d">IMPORTANT!</text><circle cx="95" cy="190" r="52" fill="#f97316"/><text x="58" y="300" font-family="system-ui, sans-serif" font-size="17" fill="#7c2d12">competing</text></g>
    <g transform="translate(270 85)"><rect width="190" height="270" rx="10" fill="#172554"/><text x="18" y="68" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="white">MAKE</text><text x="18" y="104" font-family="system-ui, sans-serif" font-size="18" fill="#93c5fd">a digital imaging lab</text><rect x="18" y="132" width="154" height="5" fill="#facc15"/><text x="18" y="176" font-family="system-ui, sans-serif" font-size="16" fill="white">Saturday • 1 PM</text><text x="18" y="205" font-family="system-ui, sans-serif" font-size="14" fill="#bfdbfe">Room 204</text><text x="55" y="300" font-family="system-ui, sans-serif" font-size="17" fill="#1e3a8a">clear order</text></g>
    <text x="28" y="410" font-family="system-ui, sans-serif" font-size="18" fill="#7c2d12">Ask: what must be read first, second, and last?</text>
  </g>
</svg>
