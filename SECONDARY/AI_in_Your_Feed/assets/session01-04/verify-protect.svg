<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Verify polished AI output and protect privacy</title>
  <desc id="desc">Three analysis cards ask whether an output is sourced, specific, and honest about uncertainty. A privacy checklist asks students to pause before uploading or sharing.</desc>
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white">Polished is not the same as trustworthy</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#cbd5e1">Session 3: inspect the output • Session 4: protect people before sharing</text>

  <g transform="translate(55 155)">
    <rect width="635" height="455" rx="20" fill="#172554" stroke="#334155" stroke-width="2"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#fde047">THREE CHECKS</text>
    <g transform="translate(28 82)" font-family="system-ui, sans-serif">
      <rect width="579" height="92" rx="13" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
      <text x="22" y="34" font-size="21" font-weight="800" fill="white">1 • SOURCED?</text>
      <text x="22" y="66" font-size="17" fill="#dbeafe">Can the claim be checked somewhere besides the AI output?</text>
      <rect y="112" width="579" height="92" rx="13" fill="#3b0764" stroke="#c084fc" stroke-width="3"/>
      <text x="22" y="146" font-size="21" font-weight="800" fill="white">2 • SPECIFIC?</text>
      <text x="22" y="178" font-size="17" fill="#f3e8ff">Whose details are missing, flattened, or replaced by cliché?</text>
      <rect y="224" width="579" height="92" rx="13" fill="#7c2d12" stroke="#fb923c" stroke-width="3"/>
      <text x="22" y="258" font-size="21" font-weight="800" fill="white">3 • CERTAIN?</text>
      <text x="22" y="290" font-size="17" fill="#ffedd5">Does the tone sound more confident than the evidence allows?</text>
    </g>
    <text x="28" y="425" font-family="system-ui, sans-serif" font-size="17" fill="#cbd5e1">Name the exact problem—not only “it feels weird.”</text>
  </g>

  <g transform="translate(740 155)">
    <rect width="405" height="455" rx="20" fill="#ecfdf5"/>
    <text x="28" y="48" font-family="system-ui, sans-serif" font-size="26" font-weight="750" fill="#065f46">PAUSE BEFORE UPLOAD</text>
    <g transform="translate(28 88)" font-family="system-ui, sans-serif">
      <g><circle cx="18" cy="18" r="18" fill="#059669"/><text x="18" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="white">1</text><text x="55" y="14" font-size="19" font-weight="750" fill="#064e3b">PRIVATE DATA?</text><text x="55" y="40" font-size="16" fill="#065f46">name, ID, login, location</text></g>
      <g transform="translate(0 78)"><circle cx="18" cy="18" r="18" fill="#059669"/><text x="18" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="white">2</text><text x="55" y="14" font-size="19" font-weight="750" fill="#064e3b">MY MEDIA?</text><text x="55" y="40" font-size="16" fill="#065f46">face, voice, private files</text></g>
      <g transform="translate(0 156)"><circle cx="18" cy="18" r="18" fill="#059669"/><text x="18" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="white">3</text><text x="55" y="14" font-size="19" font-weight="750" fill="#064e3b">THEIR CONSENT?</text><text x="55" y="40" font-size="16" fill="#065f46">another person’s image or voice</text></g>
      <g transform="translate(0 234)"><circle cx="18" cy="18" r="18" fill="#059669"/><text x="18" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="white">4</text><text x="55" y="14" font-size="19" font-weight="750" fill="#064e3b">WHO WILL SEE IT?</text><text x="55" y="40" font-size="16" fill="#065f46">classroom is not the public web</text></g>
    </g>
    <text x="28" y="415" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#064e3b">A tool can accept data without deserving it.</text>
  </g>
</svg>
