<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Gesture sensing map: change, sensing, interpretation, response, reflection</title><desc id="desc">A five-stage diagram for sensing and gesture: a chosen gesture, object, voice, or recorded data is partially sensed; a mapping interprets the signal; the system responds; and learners reflect on what was missed or assumed. A consent banner states that students choose how their body participates.</desc><style>.h{font:700 38px Arial,sans-serif;fill:#14213d}.s{font:400 18px Arial,sans-serif;fill:#40516d}.t{font:700 22px Arial,sans-serif;fill:#14213d}.c{font:400 16px Arial,sans-serif;fill:#263a57}.n{font:700 27px Arial,sans-serif;fill:#fff}.b{font:700 21px Arial,sans-serif;fill:#174e39}</style><rect width="1200" height="700" fill="#f7f9fc"/><text x="48" y="60" class="h">Gesture sensing: make the system’s choices visible</text><text x="48" y="92" class="s">A sensor measures only part of a change. The mapping—and its limits—are part of the work.</text><g stroke-width="3"><rect x="43" y="169" width="202" height="320" rx="19" fill="#fff6e3" stroke="#db9b19"/><rect x="271" y="169" width="202" height="320" rx="19" fill="#eaf3ff" stroke="#4a90d9"/><rect x="499" y="169" width="202" height="320" rx="19" fill="#edf9f2" stroke="#42a26b"/><rect x="727" y="169" width="202" height="320" rx="19" fill="#f1eeff" stroke="#7561c7"/><rect x="955" y="169" width="202" height="320" rx="19" fill="#fff0f0" stroke="#cb545c"/></g><g><circle cx="81" cy="210" r="25" fill="#db9b19"/><text x="73" y="220" class="n">1</text><text x="68" y="263" class="t">Gesture /</text><text x="68" y="289" class="t">chosen input</text><text x="68" y="334" class="c">Body, object, voice,</text><text x="68" y="358" class="c">drawing, or sample data.</text><circle cx="309" cy="210" r="25" fill="#4a90d9"/><text x="301" y="220" class="n">2</text><text x="296" y="263" class="t">Sensing</text><text x="296" y="289" class="t">a partial signal</text><text x="296" y="334" class="c">What can the person</text><text x="296" y="358" class="c">or device measure?</text><circle cx="537" cy="210" r="25" fill="#42a26b"/><text x="529" y="220" class="n">3</text><text x="524" y="263" class="t">Mapping /</text><text x="524" y="289" class="t">interpretation</text><text x="524" y="334" class="c">What rule connects</text><text x="524" y="358" class="c">signal to meaning?</text><circle cx="765" cy="210" r="25" fill="#7561c7"/><text x="757" y="220" class="n">4</text><text x="752" y="263" class="t">Response</text><text x="752" y="289" class="t">becomes visible</text><text x="752" y="334" class="c">Sound, image, light,</text><text x="752" y="358" class="c">text, movement, event.</text><circle cx="993" cy="210" r="25" fill="#cb545c"/><text x="985" y="220" class="n">5</text><text x="980" y="263" class="t">Reflect</text><text x="980" y="289" class="t">and revise</text><text x="980" y="334" class="c">What was missed,</text><text x="980" y="358" class="c">assumed, or possible?</text></g><g fill="none" stroke="#395571" stroke-width="6" stroke-linecap="round"><path d="M246 335h19"/><path d="M474 335h19"/><path d="M702 335h19"/><path d="M930 335h19"/></g><g fill="#395571"><path d="M265 327l12 8-12 8z"/><path d="M493 327l12 8-12 8z"/><path d="M721 327l12 8-12 8z"/><path d="M949 327l12 8-12 8z"/></g><rect x="43" y="550" width="1114" height="82" rx="16" fill="#e9f8ef" stroke="#42a26b" stroke-width="2"/><text x="69" y="584" class="b">Consent boundary: students choose how their bodies participate, with real alternatives to touch, standing, camera use, recording, or public performance.</text><text x="69" y="614" class="c">Use fabricated or recorded data whenever embodied collection is unnecessary.</text></svg>