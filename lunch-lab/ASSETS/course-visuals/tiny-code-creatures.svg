<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Code Creatures input and response map</title>
  <desc id="desc">Button, shake, and tilt inputs lead to a micro:bit creature's face, sound, or movement response.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">One input. One response. A creature with character.</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">Tiny Code Creatures • prototype a pocket interaction</text>
  <g transform="translate(55 155)" font-family="system-ui, sans-serif"><rect width="500" height="455" rx="20" fill="#dcfce7"/><text x="28" y="48" font-size="26" font-weight="800" fill="#166534">1 • WHAT DOES A PERSON DO?</text><g text-anchor="middle" font-weight="800"><rect x="40" y="95" width="125" height="130" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/><text x="102" y="155" font-size="20" fill="#166534">BUTTON</text><text x="102" y="186" font-size="17" fill="#166534">press</text><rect x="187" y="95" width="125" height="130" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/><text x="250" y="155" font-size="20" fill="#166534">SHAKE</text><text x="250" y="186" font-size="17" fill="#166534">move</text><rect x="335" y="95" width="125" height="130" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/><text x="397" y="155" font-size="20" fill="#166534">TILT</text><text x="397" y="186" font-size="17" fill="#166534">lean</text></g><text x="40" y="335" font-size="23" font-weight="800" fill="#166534">Name the action in plain language.</text></g>
  <g transform="translate(605 155)" font-family="system-ui, sans-serif"><rect width="540" height="455" rx="20" fill="#eff6ff"/><text x="28" y="48" font-size="26" font-weight="800" fill="#1e3a8a">2 • WHAT DOES IT DO BACK?</text><rect x="190" y="110" width="160" height="185" rx="26" fill="#172554"/><circle cx="235" cy="160" r="16" fill="#f8fafc"/><circle cx="305" cy="160" r="16" fill="#f8fafc"/><path d="M230 225 Q270 255 310 225" fill="none" stroke="#facc15" stroke-width="9"/><path d="M270 295 V350" stroke="#64748b" stroke-width="6"/><g text-anchor="middle" font-weight="800"><text x="100" y="390" font-size="22" fill="#1e3a8a">FACE</text><text x="270" y="390" font-size="22" fill="#1e3a8a">SOUND</text><text x="440" y="390" font-size="22" fill="#1e3a8a">MOTION</text></g><text x="270" y="435" text-anchor="middle" font-size="19" fill="#475569">A clear mapping makes a playful interaction legible.</text></g>
</svg>
