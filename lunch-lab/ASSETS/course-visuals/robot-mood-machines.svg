<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Robot Mood Machines behavior controls</title>
  <desc id="desc">Speed, pause, turn, light, and sound controls combine into different observable robot moods.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">A mood is behavior people can notice.</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">Robot Mood Machines • design behavior, not just motion</text>
  <g transform="translate(55 155)" font-family="system-ui, sans-serif"><rect width="500" height="455" rx="20" fill="#eff6ff"/><text x="28" y="48" font-size="26" font-weight="800" fill="#1e3a8a">1 • CHOOSE THE CONTROLS</text>
    <g font-size="22" font-weight="800"><rect x="35" y="85" width="190" height="70" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="130" y="129" text-anchor="middle" fill="#1e3a8a">SPEED</text><rect x="275" y="85" width="190" height="70" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="370" y="129" text-anchor="middle" fill="#1e3a8a">PAUSE</text><rect x="35" y="190" width="190" height="70" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="130" y="234" text-anchor="middle" fill="#1e3a8a">TURN</text><rect x="275" y="190" width="190" height="70" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="370" y="234" text-anchor="middle" fill="#1e3a8a">LIGHT</text><rect x="155" y="295" width="190" height="70" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="250" y="339" text-anchor="middle" fill="#1e3a8a">SOUND</text></g>
  </g><g transform="translate(605 155)" font-family="system-ui, sans-serif"><rect width="540" height="455" rx="20" fill="#fff7ed"/><text x="28" y="48" font-size="26" font-weight="800" fill="#9a3412">2 • MAKE A MOOD LEGIBLE</text>
    <g text-anchor="middle" font-weight="800"><rect x="45" y="90" width="190" height="220" rx="20" fill="#fff" stroke="#fb923c" stroke-width="4"/><circle cx="140" cy="175" r="50" fill="#fef3c7"/><circle cx="123" cy="165" r="6"/><circle cx="157" cy="165" r="6"/><path d="M115 195 Q140 220 165 195" fill="none" stroke="#9a3412" stroke-width="5"/><text x="140" y="275" font-size="21" fill="#9a3412">CURIOUS</text><rect x="300" y="90" width="190" height="220" rx="20" fill="#fff" stroke="#fb923c" stroke-width="4"/><circle cx="395" cy="175" r="50" fill="#dbeafe"/><circle cx="378" cy="165" r="6"/><circle cx="412" cy="165" r="6"/><path d="M370 200 H420" stroke="#1e3a8a" stroke-width="5"/><text x="395" y="275" font-size="21" fill="#1e3a8a">CALM</text></g><text x="45" y="385" font-size="21" font-weight="700" fill="#9a3412">Can someone identify the mood before you name it?</text>
  </g>
</svg>
