<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AI Workflow Arcade inspectable workflow</title>
  <desc id="desc">A brief moves through a supplied source, constrained tool, inspectable output, verification desk, and human decision.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="55" y="68" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#0f172a">The answer is not the workflow.</text>
  <text x="55" y="108" font-family="system-ui, sans-serif" font-size="21" fill="#475569">AI Workflow Arcade • tools, sources, constraints, verification, judgment</text>
  <g transform="translate(55 155)" font-family="system-ui, sans-serif"><rect width="1090" height="455" rx="20" fill="#f3e8ff"/><text x="35" y="52" font-size="26" font-weight="800" fill="#6b21a8">MAKE THE CHAIN INSPECTABLE</text>
    <g text-anchor="middle" font-weight="800"><g fill="#fff" stroke-width="4"><rect x="30" y="145" width="170" height="145" rx="18" stroke="#9333ea"/><rect x="245" y="145" width="170" height="145" rx="18" stroke="#9333ea"/><rect x="460" y="145" width="170" height="145" rx="18" stroke="#9333ea"/><rect x="675" y="145" width="170" height="145" rx="18" stroke="#d97706"/><rect x="890" y="145" width="170" height="145" rx="18" stroke="#16a34a"/></g><g font-size="20"><text x="115" y="195" fill="#6b21a8">BRIEF</text><text x="115" y="227" fill="#475569">what matters?</text><text x="330" y="195" fill="#6b21a8">SOURCE</text><text x="330" y="227" fill="#475569">what is known?</text><text x="545" y="195" fill="#6b21a8">TOOL + LIMITS</text><text x="545" y="227" fill="#475569">what may it do?</text><text x="760" y="195" fill="#9a3412">VERIFY</text><text x="760" y="227" fill="#475569">what survives?</text><text x="975" y="195" fill="#166534">DECIDE</text><text x="975" y="227" fill="#475569">human approves</text></g></g>
    <g stroke="#64748b" stroke-width="7" fill="none"><path d="M200 217 H235"/><path d="M415 217 H450"/><path d="M630 217 H665"/><path d="M845 217 H880"/></g><g fill="#64748b"><path d="M235 217 l-15 -11 v22z"/><path d="M450 217 l-15 -11 v22z"/><path d="M665 217 l-15 -11 v22z"/><path d="M880 217 l-15 -11 v22z"/></g><text x="545" y="370" text-anchor="middle" font-size="24" font-weight="800" fill="#6b21a8">A generated artifact is a draft until a person can inspect and decide.</text></g>
</svg>
